# =============================================
# Database Configuration for Shopping System
# =============================================

# MySQL Driver for MySQL 8.x is com.mysql.cj.jdbc.Driver?
jdbc.driver=com.mysql.cj.jdbc.Driver

# Database URL
# Options:
#   useSSL=false          - Disable SSL connection
#   serverTimezone=Asia/Shanghai - Set timezone
#   allowPublicKeyRetrieval=true - Allow public key retrieval
#   characterEncoding=utf8 - Set character encoding
jdbc.url=jdbc:mysql://localhost:3306/shopping?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&tinyInt1isBit=false

# Database Username
jdbc.username=root

# Database Password
jdbc.password=655655

# =============================================
# Druid Connection Pool Configuration
# =============================================

# Initial Size
druid.initialSize=5

# Minimum Idle Connections
druid.minIdle=5

# Maximum Active Connections
druid.maxActive=20

# Maximum Wait Time
druid.maxWait=60000

# Validation SQL
druid.validationQuery=SELECT 1

# Test While Idle
druid.testWhileIdle=true

# Time Between Eviction Runs
druid.timeBetweenEvictionRunsMillis=60000

# Minimum Evictable Idle Time
druid.minEvictableIdleTimeMillis=300000

# Pool Prepared Statements for MySQL
druid.poolPreparedStatements=false